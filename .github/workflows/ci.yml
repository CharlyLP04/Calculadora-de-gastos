name: Validar Clara
on:
  push:
    branches: [main, improve-profile-glass]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx firebase emulators:exec --only firestore --project demo-clara-profiles "node --test tests/firestore-rules.test.mjs"
      - run: node server/sync.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: clara-dist
          path: dist

